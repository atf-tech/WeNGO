{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>{% block title %}WeNGO RM Portal{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'website_v3/css/chat_widget.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>
    <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet"/>

    <style>
        :root {
            --primary: #2c4a8f;
            --bg: #f0f4fa;
            --card-bg: #ffffff;
            --text: #1a2340;
            --muted: #6b7a99;
            --border: #d0d9ee;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
        }
        .top-bar {
            background: var(--primary);
            color: #fff;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 10px rgba(44,74,143,0.18);
        }
        .page-wrapper { padding: 24px 20px; max-width: 1400px; margin: 0 auto; }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(44,74,143,0.09);
            background: var(--card-bg);
        }
        .card-header {
            border-bottom: 1px solid var(--border);
            padding: 16px 22px;
        }
        .card-header h5 { font-size: 0.97rem; font-weight: 700; color: var(--primary); margin: 0; }
        .card-body { padding: 18px 22px; }
    </style>
</head>
<body>
    {% include 'RMPortal/includes/header.html' %}
    {% include 'RMPortal/includes/sidebar.html' %}

    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </div>
        {% include 'RMPortal/includes/footer.html' %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
    <script src="{% static 'website/js/vendor/jquery.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
